[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-document-converter"
version = "0.1.0"
description = "Local-first document conversion through a stable Document IR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Local Document Converter contributors" }]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
docling = [
  "docling>=2,<3",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
]
ocr = [
  "paddleocr>=3,<4",
]

[project.scripts]
local-doc-convert = "local_document_converter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_document_converter"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = '-ra --strict-markers -m "not integration and not ocr"'
testpaths = ["tests"]
markers = [
  "integration: tests that exercise real third-party parsing runtimes",
  "ocr: tests that may load or download OCR models",
  "e2e: command-line end-to-end tests",
]

[tool.coverage.run]
source = ["local_document_converter"]
branch = true
