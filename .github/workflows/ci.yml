name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check src tests scripts

      - name: Mypy
        run: python -m mypy src tests scripts

      - name: Unit and mocked tests
        run: python -m pytest -q -m "not integration and not ocr"

      - name: Core CLI smoke
        run: |
          local-doc-convert --help
          local-doc-convert formats

      - name: Build wheel
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build

      - name: Verify release artifact boundary
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python scripts\verify_release_artifact.py $wheel.FullName
